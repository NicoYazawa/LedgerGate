name: CodeGraph impact gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: impact-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CodeGraph validators
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codegraph-tool" \
            --no-save --ignore-scripts @longbowzz/dsh-codegraph@0.4.0
          echo "CODEGRAPH_SCRIPTS=$RUNNER_TEMP/codegraph-tool/node_modules/@longbowzz/dsh-codegraph/skills/codegraph/scripts" >> "$GITHUB_ENV"

      - name: Build impact artifacts and run gate
        shell: pwsh
        env:
          CODEGRAPH_ENFORCE: ${{ vars.CODEGRAPH_ENFORCE }}
        run: |
          $enforce = $env:CODEGRAPH_ENFORCE -eq 'true'
          $allowSignatures = "${{ contains(github.event.pull_request.labels.*.name, 'signature-change') }}" -eq 'true'
          $stage = (Get-Content "docs/reviews/current-stage.txt" -Raw).Trim()
          ./scripts/pr-impact.ps1 `
            -Base "origin/${{ github.base_ref }}" `
            -Out "artifacts/pr-impact" `
            -Stage $stage `
            -CodeGraphScripts "$env:CODEGRAPH_SCRIPTS" `
            -BlastRadius 20 `
            -AllowSignatures:$allowSignatures `
            -Enforce:$enforce

      - name: Upload impact artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-impact
          path: artifacts/pr-impact
          if-no-files-found: ignore

      - name: Post or update PR comment
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/post-impact-comment.ps1 `
            -Pr ${{ github.event.pull_request.number }} `
            -Path "artifacts/pr-impact/summary.md"
